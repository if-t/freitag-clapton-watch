name: F155 CLAPTON watch

on:
  schedule:
    # Every 5 minutes — the shortest interval GitHub Actions allows.
    # Scheduled runs are best-effort and may drift by a few minutes.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Serialise runs so two checks never race on pushing the state file.
concurrency:
  group: clapton-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for new bags
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python scraper.py

      - name: Persist seen SKUs
        run: |
          if [ -z "$(git status --porcelain state/)" ]; then
            echo "no state change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git commit -m "state: update seen F155 CLAPTON SKUs [skip ci]"
          git push
